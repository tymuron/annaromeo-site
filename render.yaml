services:
  - type: web
    name: annaromeo-design
    runtime: static
    buildCommand: ""
    staticPublishPath: site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
